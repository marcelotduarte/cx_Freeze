# Read the Docs configuration file. See details at:
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

python:
  install:
    - method: uv
      command: sync
      groups:
        - doc

sphinx:
  builder: html
  configuration: doc/src/conf.py
  fail_on_warning: true
