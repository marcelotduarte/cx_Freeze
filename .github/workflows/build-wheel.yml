name: Build wheel

on:
  release:
    types:
      - created
  workflow_call:
    inputs:
      branch:
        default: ${{ github.ref }}
        required: false
        type: string
  workflow_dispatch:
    inputs:
      branch:
        default: main
        required: true
        type: choice
        options:
          - develop
          - main

concurrency:
  group: build-wheel-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build_sdist:
    name: Build sdist for cx_Freeze
    uses: $/.github/workflows/build-sdist.yml
    with:
      branch: ${{ inputs.branch }}
      dev: ${{ github.event_name != 'release' }}

  build_wheel:
    needs:
      - build_sdist
    name: Build wheel
    runs-on: ubuntu-latest
    env:
      UV_NO_PROGRESS: true
      UV_SYSTEM_PYTHON: true
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Download sdist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cx-freeze-sdist
          path: dist

      - name: Checkout from sdist
        run: |
          (cd dist && tar xvf cx_freeze-*.tar.gz)
          mv dist/cx_freeze-*/* .
          rm -rf dist
          ls -l

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Build sdist and wheels
        run: ./ci/build-wheel.sh

      - name: Upload the artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cx-freeze-wheel
          path: wheelhouse
          compression-level: 0

  publish:
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags')
    name: Publish package to PyPI
    needs:
      - build_wheel
    environment:
      name: pypi
      url: https://pypi.org/p/cx-Freeze
    permissions:
      id-token: write # MANDATORY: Required for OIDC Trusted Publishing
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: wheelhouse
          pattern: cx-freeze-*
          merge-multiple: true

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: wheelhouse/
          skip-existing: true
          verbose: true
