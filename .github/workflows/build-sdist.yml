name: Build sdist

on:
  workflow_call:
    inputs:
      branch:
        default: main
        required: false
        type: string
      dev:
        default: false
        required: false
        type: boolean
  workflow_dispatch:
    inputs:
      branch:
        default: main
        required: true
        type: choice
        options:
          - develop
          - main
      dev:
        default: false
        required: false
        type: boolean

concurrency:
  group: build-sdist-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    env:
      UV_NO_PROGRESS: true
      UV_SYSTEM_PYTHON: true
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          repository: marcelotduarte/cx_Freeze
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          python-version: "3.14"

      - name: Bump new dev version
        if: ${{ inputs.dev }}
        run: ./ci/bump-version.sh build-dev

      - name: Build source distribution
        run: uv build --sdist

      - name: Upload the artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cx-freeze-sdist
          path: dist
          compression-level: 0 # no compression
